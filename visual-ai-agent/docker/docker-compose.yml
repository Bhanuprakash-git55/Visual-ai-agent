version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visualai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visualai}
      POSTGRES_DB: ${POSTGRES_DB:-visual_ai}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "3000:3000"

  extension:
    # Extension is typically built and distributed; include for reference
    build:
      context: ..
      dockerfile: docker/Dockerfile.extension

volumes:
  db-data:

